name: Update Daily Digest

on:
  schedule:
    - cron: '0 */4 * * *' # Runs every 4 hours (UTC)
  workflow_dispatch:      # Allows manual runs anytime

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        pip install google-genai

      - name: Generate updated HTML
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_page.py

      - name: Commit and push updated page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update digest" && git push)
